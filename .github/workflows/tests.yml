name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.5
      - run: ruff check .

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit + regression tests
        run: python -m pytest tests -v -m "not slow"
      - name: Dashboard smoke test
        if: matrix.python-version == '3.11'
        run: python -m pytest tests -v -m slow

  reproducibility:
    # The committed artifacts (tasks, normalized results, enriched results,
    # scorecards, domain-adaptation and reliability summaries) must be exactly
    # what the current code regenerates from the raw inputs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate committed data
        run: finagent-eval validate
      - name: Regenerate every artifact
        run: finagent-eval all
      - name: Committed artifacts are up to date
        run: |
          git status --porcelain
          git diff --stat
          git diff --exit-code -- data results reports
