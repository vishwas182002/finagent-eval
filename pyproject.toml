[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent-eval"
version = "0.2.0"
description = "Reproducible evaluation harness for visual question answering over financial document screenshots"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Vishwas Kothari" }]
keywords = ["document-ai", "vqa", "benchmark", "finance", "vision-language-models"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core package (graders, failure modes, pipeline) has one runtime dependency.
dependencies = ["jinja2>=3.1,<4"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<2", "pandas>=2.0,<4", "plotly>=5.18,<8"]
vlm = ["torch>=2.1", "transformers>=4.49", "accelerate>=0.26", "bitsandbytes>=0.43", "qwen-vl-utils>=0.0.8", "pillow>=10"]
dev = ["pytest>=8,<10", "ruff>=0.5", "streamlit>=1.40,<2", "pandas>=2.0,<4", "plotly>=5.18,<8"]

[project.scripts]
finagent-eval = "finagent_eval.cli:main"

[project.urls]
Homepage = "https://github.com/vishwas182002/finagent-eval"
Dashboard = "https://finagent-eval.streamlit.app/"

[tool.setuptools.packages.find]
include = ["finagent_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests that take more than a few seconds (dashboard smoke test)"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E402"]
